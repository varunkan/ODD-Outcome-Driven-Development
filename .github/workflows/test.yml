name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:  # the oldest Python odd supports, the newest, and macOS
          - { os: ubuntu-22.04, python: '3.8' }
          - { os: ubuntu-latest, python: '3.13' }
          - { os: macos-latest, python: '3.13' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: python -m unittest discover -s tests
      - run: python tests/proof_index.py --check
      - run: python -m unittest discover -s bench/tests
      - run: python bench/validate.py
  gate:
    # odd judges its own pull requests with the action it ships, once this repository has adopted it (odd init)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('.odd/config.json') != ''
        uses: ./
