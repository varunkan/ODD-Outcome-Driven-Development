name: release
# Push a tag vX.Y.Z equal to odd.VERSION: the package goes to PyPI (trusted publishing, no stored token) and the
# tag becomes the version people pin in `uses: varunkan/ODD-Outcome-Driven-Development@vX.Y.Z`.
# Or run it by hand from the default branch (Actions, release, Run workflow) with the version typed in: the package
# is published the same way; the tag for the Action is then made with the GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish, without the v. It must equal odd.VERSION on this branch.
        required: true
permissions:
  contents: read
jobs:
  test:  # nothing is published from a tag whose tests fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: python -m unittest discover -s tests
      - run: python tests/proof_index.py --check
  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: The tag, or the version typed in, must match the version in odd.py
        env:
          WANTED: ${{ inputs.version || github.ref_name }}
        run: test "${WANTED#v}" = "$(python -c 'import odd; print(odd.VERSION)')"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
