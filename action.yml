name: odd gate
description: Fail the check unless every changed file is inside an outcome whose proof fails without the change.
author: varunkan
branding:
  icon: check-circle
  color: green
inputs:
  target:
    description: The branch the change will merge into. Defaults to the pull request's base, else the default branch.
    required: false
    default: ''
  comment:
    description: >-
      Post the gate's result as one pull-request comment, updated on every run. "auto" (default) comments on
      pull_request events only; "true" or "false" force it. Needs `permissions: pull-requests: write`. A comment that
      cannot be posted is logged and never changes the check's result.
    required: false
    default: auto
  token:
    description: >-
      The token used to comment. Defaults to the workflow's GITHUB_TOKEN. It is given only to the comment step, never
      to the step that runs the change's proofs.
    required: false
    default: ${{ github.token }}
  author:
    description: >-
      The login that posts the comment (the token's identity). Only a comment by this login that starts with odd's
      marker is updated; any other is left alone. Set it when `token` is a personal access token.
    required: false
    default: github-actions[bot]
runs:
  using: composite
  steps:
    - name: odd gate --recompute
      shell: bash
      env:
        TARGET: ${{ inputs.target || github.base_ref || github.event.repository.default_branch }}
      # The tool that judges the change is this action's own copy, pinned by the workflow, never the copy the change
      # carries. Its settings are read at the tip of the target branch, so a pull request cannot loosen its own gate.
      # This step runs the change's proof commands, so it is given no token. The result is written as Markdown to the
      # step summary and to a file the comment step reads.
      run: |
        set -euo pipefail
        summary="${RUNNER_TEMP:-/tmp}/odd-gate-summary.md"
        rm -f "$summary"
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --quiet --unshallow --no-tags origin; fi
        git fetch --quiet --no-tags origin "+refs/heads/$TARGET:refs/remotes/origin/$TARGET"
        rc=0
        python3 "$GITHUB_ACTION_PATH/odd.py" gate --recompute --base "refs/remotes/origin/$TARGET" --summary "$summary" || rc=$?
        if [ ! -s "$summary" ]; then
          printf '<!-- odd-gate -->\n### odd gate: COULD NOT RUN\nThe tool stopped (exit %s) before it wrote a result; see the log.\n' "$rc" > "$summary"
        fi
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
        exit "$rc"
    - name: odd comment
      if: always()
      shell: bash
      env:
        ODD_COMMENT: ${{ inputs.comment }}
        ODD_TOKEN: ${{ inputs.token }}
        ODD_AUTHOR: ${{ inputs.author }}
      # On a pull request, the gate's result goes to one comment, found again as the comment by ODD_AUTHOR that starts
      # with the hidden marker. Commenting is best effort: its failure is logged, and the check's result is the gate's.
      run: |
        set -uo pipefail
        summary="${RUNNER_TEMP:-/tmp}/odd-gate-summary.md"
        comment() {
          local pr api id body page
          pr="$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["pull_request"]["number"])')" || return 1
          api="${GITHUB_API_URL:-https://api.github.com}/repos/$GITHUB_REPOSITORY/issues"
          set -- -fsS --max-time 30 -H "Authorization: Bearer $ODD_TOKEN" -H "Accept: application/vnd.github+json"
          id=""
          for page in $(seq 1 50); do
            id="$(curl "$@" "$api/$pr/comments?per_page=100&page=$page" | python3 -c 'import json,os,sys
        cs = json.load(sys.stdin)
        mine = [c["id"] for c in cs if (c.get("user") or {}).get("login") == os.environ.get("ODD_AUTHOR", "github-actions[bot]")
                and (c.get("body") or "").startswith("<!-- odd-gate -->")]
        print(mine[0] if mine else ("" if len(cs) == 100 else "none"))')" || return 1
            [ -z "$id" ] || break
          done
          [ "$id" != none ] || id=""
          body="$(python3 -c 'import json,sys; print(json.dumps({"body": open(sys.argv[1]).read()[:60000]}))' "$summary")" || return 1
          if [ -n "$id" ]; then curl "$@" -X PATCH -d "$body" "$api/comments/$id" > /dev/null
          else curl "$@" -X POST -d "$body" "$api/$pr/comments" > /dev/null; fi
        }
        case "${ODD_COMMENT:-auto}" in
          true) want=1 ;;
          auto) [ "${GITHUB_EVENT_NAME:-}" = pull_request ] && want=1 || want=0 ;;
          *) want=0 ;;
        esac
        if [ "$want" = 1 ] && [ -s "$summary" ]; then
          if (comment); then echo "odd: the result is in the pull request's odd comment"
          else echo "odd: could not comment on the pull request (the workflow needs 'permissions: pull-requests: write'; a pull request from a fork gets a read-only token). The check's result is unchanged."
          fi
        fi
